name: Docker image

# Builds protohaven_api.Dockerfile and publishes it to GHCR.
#
# - Pull requests: build only (no push). Fork PRs get a read-only token, and
#   outside contributors' runs are gated by the repo's "Require approval for
#   all outside collaborators" Actions setting.
# - main: pushes `main` and `sha-<short>` tags.
# - v* tags (created by GitHub releases): pushes `X.Y.Z`, `X.Y`, and `latest`.
# - workflow_dispatch: manual build of any branch in this repo, tagged
#   `branch-<name>`, for testing before merge.

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Log in to GHCR
      if: github.event_name != 'pull_request'
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Generate image tags
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: ghcr.io/${{ github.repository }}
        # Each rule only fires on matching events: semver rules on v* tags
        # (which also get `latest`), branch rules on main/dispatch, sha always.
        # Non-main branches are prefixed so a branch named e.g. `0.37` or
        # `latest` can't overwrite a release tag.
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=ref,event=branch,enable=${{ github.ref_name == 'main' }}
          type=ref,event=branch,prefix=branch-,enable=${{ github.ref_name != 'main' }}
          type=sha,prefix=sha-

    - name: Build and push
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: protohaven_api.Dockerfile
        platforms: linux/amd64
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
